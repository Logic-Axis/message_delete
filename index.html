<!DOCTYPE html> 
<html lang="ja">
<head>
<!----------------------------------------------------------------->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#a9ceec" />

  <title>Freeze☭メッセージ消去ツール</title>
  <meta name="description" content="" />

  <link rel="icon" href="https://i.ibb.co/39dXLvV3/Freeze-logo.png" />

  <!-- Open Graph -->
  <meta property="og:type"        content="website" />
  <meta property="og:site_name"   content="Freeze" />
  <meta property="og:title"       content="メッセージ消去ツール" />
  <meta property="og:description" content="読んで字のごとく" />
  <meta property="og:url"         content="" />
  <meta property="og:image"       content="" />
<!----------------------------------------------------------------->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #202225; border-radius: 3px; }
    ::-webkit-scrollbar-thumb { background: #5865f2; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #7289da; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg,#2f3136,#1e1f22);
      color:#fff;
      margin:0; padding:0;
      display:flex; justify-content:center; align-items:center;
      height:100vh;
      user-select: none;
      -webkit-user-select: none;
      -ms-user-select: none;
      -moz-user-select: none;
    }
    .card {
      background:#36393f;
      padding:32px;
      border-radius:20px;
      box-shadow:0 15px 35px rgba(0,0,0,.5);
      width:100%; max-width:600px;
      animation:fadeIn .8s ease;
      overflow-y:auto;
      overflow-x:hidden;
      max-height:95vh;
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }
    h2 { color:#adb8ff; text-align:center; margin:0 0 24px; font-weight:600; }
    label { display:block; margin-top:18px; font-size:14px; }
    input[type="text"], input[type="password"], textarea {
      width:100%; padding:10px; margin-top:6px;
      border-radius:8px; border:none;
      background:#202225; color:#fff;
      font-family:monospace; resize:vertical;
    }
    textarea { overflow-y:auto; }
    input[type="number"] {
      padding:6px; margin-top:6px;
      border-radius:8px; border:none;
      background:#202225; color:#fff;
      font-family:monospace; appearance:none;
      width:80px;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance:none; margin:0;
    }
    .row {
      display:flex; gap:12px; align-items:center;
    }
    .row > * { flex:none; }
    .row label,
    .row .checkbox-container { margin-top:0; }
    .checkbox-container {
      display:flex; align-items:center; gap:8px;
      cursor:pointer; font-size:14px; user-select:none;
      margin-top:6px;
    }
    .checkbox-container input {
      appearance:none; width:36px; height:18px;
      background:#4f545c; border-radius:18px;
      position:relative; transition:background .3s ease;
    }
    .checkbox-container:hover input { background:#5a5f68; }
    .checkbox-container input:focus {
      outline:none; box-shadow:0 0 0 3px rgba(114,137,218,0.5);
    }
    .checkbox-container input::before {
      content:''; position:absolute;
      width:14px; height:14px; border-radius:50%;
      background:#fff; top:2px; left:2px;
      transition:transform .3s cubic-bezier(.68,-.55,.27,1.55);
    }
    .checkbox-container input:checked { background:#7289da; }
    .checkbox-container input:checked::before {
      transform:translateX(18px);
    }
    .checkbox-container span { transition:color .3s; }
    .checkbox-container input:checked + span {
      color:#adb8ff;
    }
    button.primary, button.secondary {
      margin-top:12px; width:auto; min-width:140px; padding:7px 14px;
      border:none; border-radius:10px;
      font-weight:600; font-size:14px;
      letter-spacing:.2px; cursor:pointer; position:relative;
      overflow:hidden; transition:all .2s;
    }
    button.primary {
      background:linear-gradient(135deg,#6d75ff,#5865f2);
      color:#fff;
      box-shadow:0 2px 8px rgba(88,101,242,.25),0 0 4px rgba(255,255,255,.08),inset 0 0 2px rgba(255,255,255,.12);
    }
    button.secondary {
      background:linear-gradient(135deg,#e74c3c,#c0392b);
      color:#fff;
      box-shadow:0 2px 8px rgba(236,81,81,.25),0 0 4px rgba(255,255,255,.08),inset 0 0 2px rgba(255,255,255,.12);
    }
    button.disabled-btn {
      background: #ccc !important;
      color: #fff !important;
      box-shadow: none !important;
      cursor: not-allowed !important;
    }
    .button-container {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    #logArea { margin-top:20px; padding:10px; height:120px; overflow-y:auto; background:#202225; border-radius:10px; font-family:monospace; font-size:12px; white-space:pre-wrap; resize: vertical;}
    @media (max-width: 600px) {
      .card {
        padding: 16px;
        max-width: 95%;
        border-radius: 10px;
      }
      h2 {
        font-size: 18px;
        margin-bottom: 16px;
      }
      label {
        font-size: 13px;
        margin-top: 12px;
      }
      input[type="text"],
      input[type="password"],
      textarea {
        padding: 8px;
        font-size: 12px;
      }
      textarea {
        height: auto;
        min-height: 60px;
      }
      button.primary,
      button.secondary {
        padding: 10px;
        font-size: 16px;
        width: 100%;
        margin-top: 12px;
      }
      .button-container {
        flex-direction: column;
        gap: 8px;
      }
      .checkbox-container {
        font-size: 13px;
        flex-direction: row;
      }
      #logArea {
        height: 80px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Freeze☭メッセージ削除ツール</h2>
    <label for="global-token">Bot Token</label>
    <input type="password" id="global-token" placeholder="Bot Tokenを入力">
    <div class="row checkbox-container">
      <input type="checkbox" id="dm-all">
      <span>すべてのDMを削除する</span>
    </div>
    <div id="dm-channel-container">
  <label for="dm-channelId">DMチャンネルID (必須)</label>
  <input type="text" id="dm-channelId" placeholder="例: 123456789012345678">
    </div>
    <button class="primary" onclick="deleteDMMessages()">DM削除開始</button>
    <p id="dm-status" class="status"></p>
    <label for="server-guildId">サーバーID</label>
    <input type="text" id="server-guildId" placeholder="例: 123456789012345678">
    <label for="server-channelIds">チャンネルID（空欄で全チャンネル対象）</label>
    <textarea id="server-channelIds" placeholder="例:
111111111111111111
222222222222222222"></textarea>
    <button class="primary" id="server-startBtn">サーバーメッセージ削除開始</button>
    <p id="server-status" class="status"></p>
    <div id="logArea">ログがここに表示されます</div>
    <div class="button-container">
      <button class="secondary" type="button" onclick="copyLogToClipboard()">ログをコピー</button>
    </div>
  </div>

  <!-- axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
